[package]
name = "fishy-vision"
version = "0.1.0"
edition = "2024"
description = "Screen capture, chess board detection and position tracking for Fishy"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.7"

[features]
# Exposes the synthetic chess.com-style frame renderer (`test_support`) to other crates' tests.
test-support = []
