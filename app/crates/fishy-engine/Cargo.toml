[package]
name = "fishy-engine"
version = "0.1.0"
edition = "2024"
description = "Stockfish UCI driver, move classification and tactic tagging for Fishy"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }
