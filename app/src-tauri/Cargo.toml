[package]
name = "fishy"
version = "0.1.1"
description = "Fishy: live visual chess analysis overlay"
authors = ["Fishy contributors"]
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
# The `_lib` suffix is necessary to keep the lib name unique from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519, Windows only).
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for transparent windows on macOS.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fishy-engine = { path = "../crates/fishy-engine" }
fishy-vision = { path = "../crates/fishy-vision" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "bitflags", "NSWindow", "NSResponder"] }

[dev-dependencies]
fishy-vision = { path = "../crates/fishy-vision", features = ["test-support"] }
shakmaty = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
